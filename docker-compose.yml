services:

  api:
    build: .
    container_name: sih-agentic-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - valkey
      - qdrant

  worker:
    build: .
    container_name: sih-agentic-worker
    command: python -m worker.main
    env_file:
      - .env
    depends_on:
      - valkey
      - qdrant

  valkey:
    image: valkey/valkey:latest
    container_name: sih-agentic-valkey
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sih-agentic-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: